name: Build and deploy MindSprint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore backend/MindSprint.Api/MindSprint.Api.csproj
      - run: dotnet build backend/MindSprint.Api/MindSprint.Api.csproj --configuration Release --no-restore

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
        working-directory: frontend

  deploy-backend:
    name: Deploy backend to Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    env:
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deployment
        if: env.RENDER_SERVICE_ID != '' && env.RENDER_API_KEY != ''
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}'

      - name: Report missing deployment credentials
        if: env.RENDER_SERVICE_ID == '' || env.RENDER_API_KEY == ''
        run: |
          echo "::warning::Render deploy skipped. Configure RENDER_SERVICE_ID and RENDER_API_KEY as GitHub Actions secrets."
